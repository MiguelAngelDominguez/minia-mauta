services:
  db:
    image: postgres:16-alpine
    container_name: minia-db
    environment:
      POSTGRES_DB: minia
      POSTGRES_USER: minia
      POSTGRES_PASSWORD: minia
    ports:
      - "5433:5432"
    volumes:
      - minia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minia -d minia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minia_pgdata:
