server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: minia-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/minia}
    username: ${DB_USER:minia}
    password: ${DB_PASSWORD:minia}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

minia:
  ai:
    mode: ${MINIA_AI_MODE:mock}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      timeout-seconds: 20
  tts:
    mode: ${MINIA_TTS_MODE:mock}
    gemini:
      model: ${GEMINI_TTS_MODEL:gemini-2.5-flash-preview-tts}
      voice: ${GEMINI_TTS_VOICE:Kore}
      timeout-seconds: 30
  audio:
    rate: 16000
    channels: 1
    max-seconds: 30
    chunk-ms: 100
    silence-ms: 300
  device:
    token: ${DEVICE_TOKEN:dev-token}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    pe.utec.minia: INFO
    org.flywaydb: INFO
