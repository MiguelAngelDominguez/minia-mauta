services:
  - type: web
    name: minia-backend
    runtime: java
    rootDir: server
    buildCommand: mvn -q -DskipTests package
    startCommand: java -jar target/minia-server-0.1.0.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: DEVICE_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: ""

databases:
  - name: minia-db
    databaseName: minia
    user: minia